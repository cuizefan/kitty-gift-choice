<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>礼物确认结果</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="result">
    <div class="page-shell page-result">
      <div class="ribbon ribbon-1"></div>
      <div class="ribbon ribbon-2"></div>
      <div class="ribbon ribbon-3"></div>
      <div class="ribbon ribbon-4"></div>
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>

      <main class="scene">
        <section class="screen active result-screen">
          <div class="result-card">
            <div class="result-badge">收到！</div>
            <h1>她选择的礼物</h1>
            <div class="result-box">
              <span id="gift-result">等待确认中...</span>
            </div>
            <p class="result-tip">请查看页面上的礼物名称，确认她的心意。</p>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
